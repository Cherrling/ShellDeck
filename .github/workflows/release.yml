name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and allowed source
        run: |
          python3 scripts/check_termux.py
          python3 scripts/release.py validate "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          if [ -n "$(git submodule status)" ]; then
            echo 'Source packaging must be extended to include submodules before publishing.' >&2
            exit 1
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true
      - name: Configure Android SDK location
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
      - name: Cache Android SDK packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-cli15859902-platform36-buildtools35-v2
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Prepare isolated SSH integration tests
        run: |
          command -v sshd || (sudo apt-get update && sudo apt-get install -y openssh-server)
          sudo mkdir -p /run/sshd
      - name: Validate before signing
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          SSH_TEST_SUDO=1 python3 scripts/ssh_test_server.py -- ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['ANDROID_KEYSTORE_BASE64']
          if not value.strip():
              raise SystemExit('Missing ANDROID_KEYSTORE_BASE64')
          data = base64.b64decode(''.join(value.split()), validate=True)
          if not data:
              raise SystemExit('Empty release keystore')
          (Path(os.environ['RUNNER_TEMP']) / 'shelldeck-release.jks').write_bytes(data)
          PY
      - name: Build signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/shelldeck-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-build-cache :app:lintRelease :app:assembleRelease
      - name: Verify identity, version and release certificate
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python3 scripts/release.py verify-apk app/build/outputs/apk/release/app-release.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shelldeck-release.jks"
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ShellDeck-${RELEASE_TAG}-universal.apk"
          git archive --format=tar.gz --prefix="ShellDeck-${RELEASE_TAG}/" \
            --output="dist/ShellDeck-${RELEASE_TAG}-source.tar.gz" HEAD
          cd dist
          sha256sum -- *.apk *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "ShellDeck $RELEASE_TAG" "${options[@]}" \
            "ShellDeck-${RELEASE_TAG}-universal.apk" \
            "ShellDeck-${RELEASE_TAG}-source.tar.gz" SHA256SUMS
