name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
      - name: Configure Android SDK location
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
      - name: Restore Android SDK packages
        id: sdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-cli15859902-platform36-buildtools35-ndk29-v3
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'ndk;29.0.14206865'
      - name: Restore Mosh native outputs
        id: mosh-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/mosh/jniLibs
            build/mosh/assets
            build/mosh/*.tar.gz
            build/mosh/fingerprint
          key: mosh-${{ runner.os }}-ndk29-api26-${{ hashFiles('scripts/build_mosh.py', 'native/mosh/**') }}
      - name: Build Mosh from pinned sources
        if: steps.mosh-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config ncurses-bin
          python3 scripts/build_mosh.py
      - name: Save Mosh native outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.mosh-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/mosh/jniLibs
            build/mosh/assets
            build/mosh/*.tar.gz
            build/mosh/fingerprint
          key: mosh-${{ runner.os }}-ndk29-api26-${{ hashFiles('scripts/build_mosh.py', 'native/mosh/**') }}
      - name: Prepare isolated SSH integration tests
        run: |
          if ! command -v sshd >/dev/null || ! command -v tmux >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y openssh-server tmux
          fi
          sudo mkdir -p /run/sshd
      - name: Check release metadata and validation logic
        run: |
          python3 scripts/check_termux.py
          python3 scripts/release.py validate
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Lint, test and build debug APK
        run: SSH_TEST_SUDO=1 python3 scripts/ssh_test_server.py -- ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :terminal-emulator:testDebugUnitTest :app:assembleDebug
      - name: Save Android SDK packages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-${{ runner.os }}-cli15859902-platform36-buildtools35-ndk29-v3
