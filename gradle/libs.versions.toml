[versions]
agp = "8.13.2"
kotlin = "2.2.21"
composeBom = "2025.08.01"
activity = "1.11.0"
core = "1.17.0"
lifecycle = "2.9.4"

[libraries]
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
sshj = { module = "com.hierynomus:sshj", version = "0.40.0" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version = "1.86" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version = "1.86" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }
room-runtime = { module = "androidx.room:room-runtime", version = "2.8.4" }
room-compiler = { module = "androidx.room:room-compiler", version = "2.8.4" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.9.1" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
